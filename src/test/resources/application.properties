# Tests never touch the real database, Tiangge or LegacySupply.
spring.datasource.url=jdbc:h2:mem:shop;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

legacysupply.base-url=http://127.0.0.1:9/api/v1
legacysupply.client-id=test-client
legacysupply.api-key=test-key
legacysupply.session-max-age-seconds=210
tiangge.base-url=http://127.0.0.1:9/tiangge/v1
spring.task.scheduling.pool.size=4
