# Hikari Settings
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.maximum-pool-size=5

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# LegacySupply Integration Properties
legacysupply.base-url=${LEGACY_SUPPLY_BASE_URL:https://legacysupply.onrender.com/api/v1}
legacysupply.client-id=${LS_CLIENT_ID:18-5617-151}
# The API key is never stored here. Set the LS_API_KEY environment variable,
# or put LS_API_KEY=... in secrets.properties next to pom.xml (ignored by Git).
spring.config.import=optional:file:./secrets.properties
legacysupply.api-key=${LS_API_KEY}
# Measured session lifetime minus a safety margin; see INTEGRATION.md
legacysupply.session-max-age-seconds=${LS_SESSION_MAX_AGE_SECONDS:210}
# Tiangge marketplace
tiangge.base-url=${TIANGGE_BASE_URL:https://legacysupply.onrender.com/tiangge/v1}
# Heartbeat, feed polling and supplier jobs must not wait for each other
